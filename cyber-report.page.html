<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button color="danger" defaultHref="./home"></ion-back-button>
    </ion-buttons>
    <ion-title>Cybersecurity Report</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngFor="let report of reports">
    <ion-card-header>
      <ion-card-title>{{ report.title }}</ion-card-title>
      <ion-card-subtitle>{{ report.date }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>{{ report.description }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
