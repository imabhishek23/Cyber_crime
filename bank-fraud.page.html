<ion-header>
  <ion-toolbar>
    <ion-title>Bank Fraud Awareness</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngFor="let fraud of fraudTypes">
    <ion-card-header>
      <ion-card-title>{{ fraud.title }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>{{ fraud.description }}</p>
      <ion-button expand="full" (click)="viewMore(fraud.link)">Learn More</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
